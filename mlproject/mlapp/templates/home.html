<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glass Classification - Premium AI</title>
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        /* Animated Gradient Background */
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(-45deg, #0f172a, #1e3a8a, #06b6d4, #312e81);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            padding: 20px;
            color: #ffffff;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Glassmorphism Container */
        .container {
            width: 100%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.05); /* Transparent White */
            backdrop-filter: blur(16px); /* Frosted Glass Effect */
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            padding: 40px;
            transform: translateY(20px);
            animation: slideUp 0.6s ease-out forwards;
            opacity: 0;
        }

        @keyframes slideUp {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        h1 {
            text-align: center;
            font-weight: 600;
            font-size: 2rem;
            margin-bottom: 30px;
            color: #ffffff;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            position: relative;
        }

        h1::after {
            content: '';
            position: absolute;
            width: 60px;
            height: 3px;
            background: #06b6d4;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 2px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 400;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.9);
            letter-spacing: 0.5px;
        }

        /* Premium Input Fields */
        .form-group input {
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: #ffffff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .form-group input:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: #06b6d4;
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.3);
            transform: translateY(-2px);
        }

        /* Glowing Submit Button */
        .submit-btn {
            grid-column: span 2;
            margin-top: 15px;
            padding: 14px;
            background: linear-gradient(135deg, #06b6d4, #2563eb);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
        }

        .submit-btn:hover {
            background: linear-gradient(135deg, #0891b2, #1d4ed8);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(37, 99, 235, 0.6);
        }

        .submit-btn:active {
            transform: translateY(1px);
        }

        /* Responsive Design */
        @media (max-width: 550px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .submit-btn {
                grid-column: span 1;
            }
            .container {
                padding: 30px 20px;
            }
            h1 {
                font-size: 1.75rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Glass Classification</h1>

        <form action="{% url 'result' %}" method="get">
            {% csrf_token %}
            
            <div class="form-grid">
                <div class="form-group">
                    <label for="RI">Refractive Index (RI):</label>
                    <input type="text" id="RI" required name="RI" placeholder="e.g. 1.518" autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="Na">Sodium (Na):</label>
                    <input type="text" id="Na" required name="Na" placeholder="e.g. 13.64" autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="Mg">Magnesium (Mg):</label>
                    <input type="text" id="Mg" required name="Mg" placeholder="e.g. 4.49" autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="Al">Aluminum (Al):</label>
                    <input type="text" id="Al" required name="Al" placeholder="e.g. 1.10" autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="Si">Silicon (Si):</label>
                    <input type="text" id="Si" required name="Si" placeholder="e.g. 71.78" autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="K">Potassium (K):</label>
                    <input type="text" id="K" required name="K" placeholder="e.g. 0.06" autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="Ca">Calcium (Ca):</label>
                    <input type="text" id="Ca" required name="Ca" placeholder="e.g. 8.75" autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="Ba">Barium (Ba):</label>
                    <input type="text" id="Ba" required name="Ba" placeholder="e.g. 0.00" autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="Fe">Iron (Fe):</label>
                    <input type="text" id="Fe" required name="Fe" placeholder="e.g. 0.00" autocomplete="off">
                </div>

                <button type="submit" class="submit-btn">Predict Glass Type</button>
            </div>
        </form>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CareerPredict</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f7fb;
            color: #17233c;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-card {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            border: 1px solid #e3e9f3;
        }

        .login-card h2 {
            font-size: 1.8rem;
            color: #2457d6;
            margin-bottom: 8px;
            text-align: center;
        }

        .login-card p.subtitle {
            color: #5f6d83;
            font-size: 0.95rem;
            text-align: center;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d5dce8;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus {
            border-color: #2457d6;
            box-shadow: 0 0 0 3px rgba(36, 87, 214, 0.15);
        }

        button {
            width: 100%;
            padding: 13px;
            border: 0;
            border-radius: 8px;
            color: #ffffff;
            background: #2457d6;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s ease, transform 0.1s ease;
        }

        button:hover {
            background: #1b44ab;
        }

        button:active {
            transform: scale(0.99);
        }

        .footer-links {
            margin-top: 25px;
            text-align: center;
            font-size: 0.9rem;
            color: #5f6d83;
            line-height: 1.6;
        }

        .footer-links a {
            color: #2457d6;
            text-decoration: none;
            font-weight: 600;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        .error-msg {
            background: #fde8e8;
            color: #dc3545;
            padding: 10px 14px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.88rem;
            margin-bottom: 20px;
            text-align: center;
            border: 1px solid #f8b4b4;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Welcome Back</h2>
        <p class="subtitle">Log in to your CareerPredict account</p>

        {% if error %}
            <div class="error-msg">{{ error }}</div>
        {% endif %}

        <form action="{% url 'login' %}" method="post">
            {% csrf_token %}

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
            </div>

            <button type="submit">Log In</button>
        </form>

        <div class="footer-links">
            Don't have an account? <a href="{% url 'signup' %}">Sign Up</a> or <a href="{% url 'studentragister' %}">Register</a>
            <br><br>
            <a href="{% url 'home' %}">← Back to Home</a>
        </div>
    </div>

</body>
</html>

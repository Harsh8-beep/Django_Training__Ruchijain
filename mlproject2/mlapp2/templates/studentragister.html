<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Arial, sans-serif; background: linear-gradient(135deg, #e0f7fa, #f5f5f5); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { width: 100%; max-width: 800px; background: #ffffff; border-radius: 16px; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12); overflow: hidden; }
        .header { background: linear-gradient(135deg, #1e88e5, #43a047); color: white; padding: 24px 30px; text-align: center; }
        .header h2 { margin: 0; font-size: 32px; }
        form { padding: 30px; }
        .form-grid { display: grid; grid-template-columns: repeat(2, minmax(220px, 1fr)); gap: 20px; }
        .field { display: flex; flex-direction: column; }
        .field.full { grid-column: 1 / -1; }
        label { font-weight: 600; margin-bottom: 8px; color: #333; }
        input, select, textarea, button { width: 100%; padding: 12px 14px; border: 1px solid #d9d9d9; border-radius: 10px; font-size: 15px; outline: none; transition: 0.2s ease; }
        input:focus, select:focus, textarea:focus { border-color: #1e88e5; box-shadow: 0 0 0 3px rgba(30, 136, 229, 0.12); }
        textarea { resize: vertical; min-height: 110px; }
        .submit-btn { margin-top: 25px; background: linear-gradient(135deg, #1e88e5, #1565c0); color: white; border: none; font-weight: 700; cursor: pointer; transition: transform 0.2s ease, opacity 0.2s ease; }
        .submit-btn:hover { transform: translateY(-1px); opacity: 0.96; }
        .login-link { text-align: center; margin-top: 15px; font-size: 14px; }
        .login-link a { color: #1e88e5; text-decoration: none; font-weight: bold; }
        @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } .header h2 { font-size: 24px; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Student Registration</h2>
        </div>

        <form action="{% url 'studentragister' %}" method="post">
            {% csrf_token %}
            <div class="form-grid">
                <div class="field">
                    <label for="student-name">Full Name / Username</label>
                    <input type="text" id="student-name" name="username" placeholder="Enter your full name" required>
                </div>

                <div class="field">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Enter email address" required>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter password" required>
                </div>

                <div class="field">
                    <label for="student-roll">Roll Number</label>
                    <input type="text" id="student-roll" name="roll_number" placeholder="Enter roll number">
                </div>

                <div class="field">
                    <label for="dob">Date of Birth</label>
                    <input type="date" id="dob" name="dob">
                </div>

                <div class="field">
                    <label for="gender">Gender</label>
                    <select id="gender" name="gender">
                        <option value="">Select Gender</option>
                        <option>Male</option>
                        <option>Female</option>
                        <option>Other</option>
                    </select>
                </div>

                <div class="field">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" placeholder="Enter phone number">
                </div>

                <div class="field">
                    <label for="course">Course</label>
                    <select id="course" name="course">
                        <option value="">Select Course</option>
                        <option>B.Sc</option>
                        <option>B.Com</option>
                        <option>B.A</option>
                        <option>B.Tech</option>
                    </select>
                </div>

                <div class="field">
                    <label for="year">Academic Year</label>
                    <select id="year" name="year">
                        <option value="">Select Year</option>
                        <option>1st Year</option>
                        <option>2nd Year</option>
                        <option>3rd Year</option>
                        <option>4th Year</option>
                    </select>
                </div>

                <div class="field full">
                    <label for="address">Address</label>
                    <textarea id="address" name="address" placeholder="Enter your address"></textarea>
                </div>
            </div>

            <button type="submit" class="submit-btn">Register Student</button>
            <div class="login-link">
                Already have an account? <a href="{% url 'login' %}">Login here</a>
            </div>
        </form>
    </div>
</body>
</html>
